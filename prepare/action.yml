# 自分のリポジトリに立ったスタブ issue を起点に、自動修正の対象かどうかを
# 見極めて、エージェントへ渡すプロンプトまで用意する。呼び出し側はこのあと、
# 対象だったときだけツールチェーンを整えて Claude Code Action を走らせる。
#
# スタブ issue は TrainLCD/Functions のフィードバックトリアージが立てる。原因の
# リポジトリは Worker が本文を読んで判定済みなので、ここでは「自分のところに
# 立っていること」を振り分けの答えとして扱う。判定をやり直さない。
#
# 重い準備（依存のインストールなど）より先にここを通すこと。立つ issue のうち
# ラベル条件まで満たすものは一部なので、先に判定しておけばその分の時間と費用が
# かからない。
name: Prepare feedback autofix
description: フィードバック issue を取得し、対象判定・無害化・プロンプト生成までを行う

inputs:
  stub_issue_number:
    description: |
      このリポジトリに立ったスタブ issue の番号。本文から管理チケットの番号を
      取り出す。issue_number を直接渡す場合は省略できる。
    required: false
    default: ""
  issue_number:
    description: |
      TrainLCD/Issues の issue 番号。手動実行でスタブ issue を介さず動かすときに
      使う。stub_issue_number より優先される。
    required: false
    default: ""
  allowed_authors:
    description: |
      スタブ issue の作成者として認めるアカウントの数値 ID（CSV）。対象リポジトリは
      公開されていて issue は誰でも立てられるため、書式だけを見て管理チケットの
      番号を受け取ると、第三者が立てた issue から非公開チケットを読み出せてしまう。
      login ではなく ID で照合する。login は変更できるうえ、手放された名前は他人が
      取得できる。空のままなら、どのスタブ issue も対象にならない。
    required: true
  issues_repo:
    description: フィードバック issue が置かれているリポジトリ
    required: false
    default: TrainLCD/Issues
  issues_repo_token:
    description: issues_repo の Issues (read and write) が付いたトークン
    required: true
  github_token:
    description: 対象リポジトリのブランチと PR を読むためのトークン
    required: true
  anthropic_api_key:
    description: 未設定なら何もせず終わるため、ここでは存在確認だけに使う
    required: true
  triage_labels:
    description: いずれか 1 つが必要なトリアージラベル（CSV）
    required: false
    default: ""
  category_labels:
    description: いずれか 1 つが必要なカテゴリラベル（CSV）
    required: false
    default: ""
  exclude_labels:
    description: 1 つでも付いていれば対象外にするラベル（CSV）
    required: false
    default: ""
  branch_prefix:
    description: 作らせるブランチの接頭辞
    required: false
    default: fix/feedback-
  base_branch:
    description: PR の base ブランチ
    required: false
    default: dev
  guidelines_file:
    description: エージェントに読ませる規約ファイル
    required: false
    default: AGENTS.md
  checks:
    description: PR を作る前に通すコマンド（改行区切り）
    required: true
  scope:
    description: このリポジトリで手を入れてよい範囲（箇条書きのまま渡す）
    required: true
  handoffs:
    description: 引き継ぎ先の候補（CSV）。自分自身は入れないこと
    required: false
    default: ""
  pr_template:
    description: PR テンプレートのパス。無ければ空文字
    required: false
    default: ""
  assignee:
    description: PR のアサイン先
    required: false
    default: TinyKitten

outputs:
  issue_number:
    description: 解決した TrainLCD/Issues の issue 番号
    value: ${{ steps.target.outputs.number }}
  eligible:
    description: 対象なら 'true'。これ以外のときは後続を動かさないこと
    value: ${{ steps.state.outputs.eligible }}
  branch:
    description: エージェントに切らせるブランチ名
    value: ${{ steps.target.outputs.branch }}
  prompt:
    description: Claude Code Action へ渡すプロンプト
    value: ${{ steps.prompt.outputs.text }}
  verdict_path:
    description: エージェントに結果を書かせるファイルのパス
    value: ${{ runner.temp }}/verdict.json
  failed:
    description: |
      対象の issue が分かったあとで準備に失敗したら 'true'。このときジョブは
      ここでは落とさず、report を走らせて「どこで止まったか」を管理チケットへ
      書いてから落とす。呼び出し側は report の条件にこの値も入れること。
    value: ${{ steps.state.outputs.failed }}

runs:
  using: composite
  steps:
    # スタブ issue を取ってくる。イベントのペイロードにも本文は入るが、式へ直接
    # 展開すると本文がそのままシェルへ渡る。API から取り直してファイルに落とし、
    # 解析はスクリプトに任せる。
    #
    # 本文だけでなく issue 全体を落とすのは、作成者を見るため。誰が立てたかを
    # 確かめずに管理チケットの番号を受け取ると、第三者が立てた issue からでも
    # 非公開チケットの本文を取得してエージェントへ渡してしまう。
    - name: Read the stub issue
      id: stub
      if: inputs.issue_number == '' && inputs.stub_issue_number != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        STUB_NUMBER: ${{ inputs.stub_issue_number }}
        ISSUES_REPO: ${{ inputs.issues_repo }}
        ALLOWED_AUTHOR_IDS: ${{ inputs.allowed_authors }}
        STUB_ISSUE_JSON_PATH: ${{ runner.temp }}/stub-issue.json
      run: |
        set -euo pipefail
        if ! printf '%s' "$STUB_NUMBER" | grep -Eq '^[0-9]+$'; then
          echo "::error::スタブ issue の番号が不正です"
          exit 1
        fi
        gh api "repos/$GITHUB_REPOSITORY/issues/$STUB_NUMBER" \
          > "$STUB_ISSUE_JSON_PATH"
        node "${{ github.action_path }}/../scripts/stub-issue.mjs"

    # 管理チケットの番号を確定させる。手で渡された値も、スタブから取り出した値も、
    # 数字だけでできていることをここで確かめてから後ろのコマンドへ渡す。
    - name: Resolve target issue
      id: target
      shell: bash
      env:
        RAW_ISSUE_NUMBER: ${{ inputs.issue_number || steps.stub.outputs.number }}
        BRANCH_PREFIX: ${{ inputs.branch_prefix }}
      run: |
        set -euo pipefail
        if ! printf '%s' "$RAW_ISSUE_NUMBER" | grep -Eq '^[0-9]+$'; then
          echo "::notice::管理チケットの番号を特定できないため、ここで終わります"
          echo "number=" >> "$GITHUB_OUTPUT"
          echo "branch=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "number=$RAW_ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
        echo "branch=${BRANCH_PREFIX}${RAW_ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"

    - name: Check credentials
      id: guard
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        ISSUES_REPO_TOKEN: ${{ inputs.issues_repo_token }}
      run: |
        set -euo pipefail
        if [ -z "${ANTHROPIC_API_KEY:-}" ] || [ -z "${ISSUES_REPO_TOKEN:-}" ]; then
          echo "::warning::ANTHROPIC_API_KEY か ISSUES_REPO_TOKEN が未設定のため自動修正をスキップします"
          echo "enabled=false" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        fi

    # 同じ issue を二度扱わないようにする。見るのは次の 3 つで、それぞれ別の
    # 状態に対応している。
    #  - ブランチ: PR を出す前に実行が落ちると、これだけが残る
    #  - PR: ブランチを消したあとの merged / closed を見つける
    #  - issue のコメント: 「直せない」と書いて終えたかどうかを見る。この場合は
    #    PR もブランチも残らないので、ここを見ないとラベルが付き直すたびに
    #    同じ調査をやり直し、同じコメントが積み上がっていく
    - name: Check for existing work
      id: existing
      if: steps.guard.outputs.enabled == 'true' && steps.target.outputs.number != ''
      # ここから先の失敗ではジョブを落とさない。落とすと report が走らず、
      # 管理チケットには何も残らないまま赤くなるだけになる。どこで止まったかは
      # 最後の Summarize preparation がまとめ、report が書いてから落とす。
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        ISSUES_REPO_TOKEN: ${{ inputs.issues_repo_token }}
        ISSUES_REPO: ${{ inputs.issues_repo }}
        BRANCH: ${{ steps.target.outputs.branch }}
        ISSUE_NUMBER: ${{ steps.target.outputs.number }}
      run: |
        set -euo pipefail
        if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" > /dev/null 2>&1; then
          echo "::notice::ブランチ $BRANCH が既にあるため処理を中止します"
          echo "found=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        COUNT="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state all --json number --jq 'length')"
        if [ "$COUNT" != "0" ]; then
          echo "::notice::$BRANCH の PR が既にあるため処理を中止します"
          echo "found=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # --paginate と --jq を一緒に使うとページごとに jq が走るので、件数は
        # 行数で数える。目印の綴りは feedback-autofix-comment.mjs の markerFor と
        # 揃えてある。リポジトリ名まで見るのは、同じ issue を 3 リポジトリが順に
        # 扱うため。共通の綴りで探すと、先に結果を書いたリポジトリのコメントで
        # 自分まで止まる。
        # 目印はシェルで組み立て、jq へは env 経由で渡す。jq の式に直接埋めると
        # 引用の入れ子が深くなり、綴りを間違えても静かに 0 件になる。
        export MARKER="<!-- auto-fix-from-feedback:$GITHUB_REPOSITORY -->"
        COMMENTED="$(GH_TOKEN="$ISSUES_REPO_TOKEN" gh api \
          "repos/$ISSUES_REPO/issues/$ISSUE_NUMBER/comments" --paginate \
          --jq '.[] | select(.body | startswith(env.MARKER)) | .id' | wc -l)"
        if [ "$COMMENTED" != "0" ]; then
          echo "::notice::この issue は結果を書き終えているため処理を中止します"
          echo "found=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "found=false" >> "$GITHUB_OUTPUT"

    # issue は別のリポジトリ（プライベート）にあるので、専用のトークンで取りに
    # 行く。本文は信用できない入力なので、シェル変数へ展開せず JSON のまま
    # スクリプトへ渡す。
    - name: Fetch feedback issue
      id: fetch
      if: steps.guard.outputs.enabled == 'true' && steps.existing.outputs.found == 'false'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.issues_repo_token }}
        ISSUES_REPO: ${{ inputs.issues_repo }}
        ISSUE_NUMBER: ${{ steps.target.outputs.number }}
      run: |
        set -euo pipefail
        gh api "repos/$ISSUES_REPO/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/issue.json"

    # ラベルの条件をこちら側でも確かめ、個人情報を取り除いた本文を書き出す。
    # dispatch を投げてきた側の判断だけに頼らないようにするため。
    - name: Evaluate and sanitize
      id: feedback
      if: steps.guard.outputs.enabled == 'true' && steps.existing.outputs.found == 'false'
      continue-on-error: true
      shell: bash
      env:
        ISSUE_JSON_PATH: ${{ runner.temp }}/issue.json
        OUTPUT_PATH: ${{ runner.temp }}/feedback.md
        TRIAGE_LABELS: ${{ inputs.triage_labels }}
        CATEGORY_LABELS: ${{ inputs.category_labels }}
        EXCLUDE_LABELS: ${{ inputs.exclude_labels }}
      run: node "${{ github.action_path }}/../scripts/feedback-issue.mjs"

    # プロンプトは 3 リポジトリで共通の本文に、リポジトリごとの差分を差し込んで
    # 組み立てる。文面が各リポジトリに散ると、直すときに 3 か所直すことになる。
    - name: Compose the prompt
      id: prompt
      if: steps.feedback.outputs.eligible == 'true'
      continue-on-error: true
      shell: bash
      env:
        TARGET_REPO: ${{ github.repository }}
        FEEDBACK_PATH: ${{ runner.temp }}/feedback.md
        VERDICT_PATH: ${{ runner.temp }}/verdict.json
        GUIDELINES_FILE: ${{ inputs.guidelines_file }}
        CHECKS: ${{ inputs.checks }}
        SCOPE: ${{ inputs.scope }}
        HANDOFFS: ${{ inputs.handoffs }}
        BRANCH: ${{ steps.target.outputs.branch }}
        BASE_BRANCH: ${{ inputs.base_branch }}
        PR_TEMPLATE: ${{ inputs.pr_template }}
        ISSUES_REPO: ${{ inputs.issues_repo }}
        ISSUE_NUMBER: ${{ steps.target.outputs.number }}
        # issue_number を直接渡されたときは、スタブ issue を介していない。その
        # ときに番号を渡すと、エージェントが無関係な issue を Closes で閉じる。
        STUB_ISSUE_NUMBER: ${{ inputs.issue_number == '' && inputs.stub_issue_number || '' }}
        ASSIGNEE: ${{ inputs.assignee }}
        OUTPUT_PATH: ${{ runner.temp }}/prompt.md
      run: |
        set -euo pipefail
        node "${{ github.action_path }}/../scripts/compose-prompt.mjs"
        # 複数行の値は区切りを決めて渡す。本文は自分で組み立てたものなので、
        # 区切りと衝突しないことが分かっている。
        {
          echo "text<<FEEDBACK_AUTOFIX_PROMPT_EOF"
          cat "$RUNNER_TEMP/prompt.md"
          echo "FEEDBACK_AUTOFIX_PROMPT_EOF"
        } >> "$GITHUB_OUTPUT"

    # ここまでの結果をまとめる。continue-on-error を付けた 4 つはジョブを落とさ
    # ないので、失敗したかどうかは outcome を見ないと分からない。
    #
    # 対象の issue が分かる前に落ちた場合は failed にしない。管理チケットの番号が
    # 無く、report は書き込む先を決められない。対象でなかった場合も failed には
    # しない。何も書かずに終えるのが設計どおりの動きだから。
    - name: Summarize preparation
      id: state
      shell: bash
      env:
        ISSUE_NUMBER: ${{ steps.target.outputs.number }}
        ENABLED: ${{ steps.guard.outputs.enabled }}
        ELIGIBLE: ${{ steps.feedback.outputs.eligible }}
        EXISTING_OUTCOME: ${{ steps.existing.outcome }}
        FETCH_OUTCOME: ${{ steps.fetch.outcome }}
        EVALUATE_OUTCOME: ${{ steps.feedback.outcome }}
        PROMPT_OUTCOME: ${{ steps.prompt.outcome }}
      run: |
        set -euo pipefail
        FAILED=false
        if [ -n "$ISSUE_NUMBER" ] && [ "$ENABLED" = "true" ]; then
          for OUTCOME in "$EXISTING_OUTCOME" "$FETCH_OUTCOME" \
            "$EVALUATE_OUTCOME" "$PROMPT_OUTCOME"; do
            if [ "$OUTCOME" = "failure" ]; then
              FAILED=true
              break
            fi
          done
        fi
        if [ "$FAILED" = "true" ]; then
          echo "::error::準備の途中で止まりました。結果を管理チケットへ書いてから終わります"
          echo "failed=true" >> "$GITHUB_OUTPUT"
          # 途中で止まったときはプロンプトが揃っていないので、エージェントは
          # 動かさない。
          echo "eligible=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "failed=false" >> "$GITHUB_OUTPUT"
        echo "eligible=${ELIGIBLE:-false}" >> "$GITHUB_OUTPUT"
